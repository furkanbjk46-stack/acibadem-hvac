[theme]
# Primary color - Acibadem blue
primaryColor = "#012D75"

# AÇIK TEMA — portalın CSS'i zaten açık renk çiziyor.
# Önceden burada KOYU tema yazılıydı (#0e1525) ve CSS'le ezilmemiş her
# yerleşik bileşen koyu kalıyordu: tarih seçicide boş günler siyah blok,
# sayı kutusundaki +/- düğmeleri koyu lacivert zemin üzerine mavi ikon
# (23.10.2026 ekran görüntüleri). Tema ile CSS artık aynı şeyi söylüyor.
backgroundColor = "#ecebe8"
secondaryBackgroundColor = "#ffffff"

# Text color
textColor = "#24324d"

# Font
font = "sans serif"

[server]
headless = true
maxUploadSize = 500
enableXsrfProtection = false
enableCORS = false
